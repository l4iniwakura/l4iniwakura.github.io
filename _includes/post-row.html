<article class="post-row" data-post data-search="{{ include.post.title | append: ' ' | append: include.post.description | downcase | escape }}">
  <div class="post-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{% include date.html date=include.post.date %}</time>{% if include.post.demo %}<span>Демо-статья</span>{% endif %}</div>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p>{{ include.post.description | escape }}</p>
  <a class="read-link" href="{{ include.post.url | relative_url }}">Читать запись <span aria-hidden="true">↗</span></a>
</article>
