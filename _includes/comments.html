<section class="comments" aria-labelledby="comments-title">
  <h2 id="comments-title">Поговорим?</h2>
  <p>Для комментария понадобится аккаунт GitHub.</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="{{ '/assets/giscus.css' | absolute_url }}"
    data-lang="ru"
    data-loading="lazy"
    crossorigin="anonymous"
    async></script>
  <noscript>Для встроенных комментариев нужен JavaScript. <a href="https://github.com/{{ site.giscus.repo }}/discussions">Открыть обсуждения на GitHub</a>.</noscript>
</section>
