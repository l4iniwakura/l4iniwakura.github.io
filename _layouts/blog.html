<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#233c31">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/blog/feed.xml' | relative_url }}">
  <script src="{{ '/assets/blog.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="room">
    <aside class="sidebar">
      <a class="brand" href="{{ '/blog/' | relative_url }}">{% include mark.svg %}<span>Блог</span></a>
      <p class="owner">Личный блог<br><a href="https://github.com/l4iniwakura">l4iniwakura</a></p>
      <nav aria-label="Навигация блога">
        <a href="{{ '/blog/' | relative_url }}"{% if page.section == 'home' %} aria-current="page"{% endif %}>Статьи <span aria-hidden="true">↗</span></a>
        <a href="{{ '/blog/catalogs/' | relative_url }}"{% if page.section == 'catalogs' %} aria-current="page"{% endif %}>Каталоги <span aria-hidden="true">↗</span></a>
        <a href="{{ '/blog/archive/' | relative_url }}"{% if page.section == 'archive' %} aria-current="page"{% endif %}>Архив <span aria-hidden="true">↗</span></a>
      </nav>
      <div class="sidebar-bottom">
        <button class="light-switch" type="button" aria-pressed="false" hidden>
          <svg width="22" height="24" viewBox="0 0 22 24" fill="none" aria-hidden="true"><path d="M5 3h12l4 12H1L5 3Zm6 12v7m-5 0h10" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Приглушить свет</span>
        </button>
        <a class="small-link" href="{{ '/blog/feed.xml' | relative_url }}">Подписаться по RSS ↗</a>
        <a class="small-link" href="{{ '/' | relative_url }}">На главную ↗</a>
      </div>
    </aside>
    <div class="sheet">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="footer"><span>l4iniwakura</span><a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a></footer>
    </div>
  </div>
</body>
</html>
